name: Update data

on:
  schedule:
    - cron: '0 11 * * *'   # every morning, about 6 a.m. Central
    - cron: '0 23 * * *'   # every evening, about 6 p.m. Central (fresher lines)
  workflow_dispatch:       # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull season data
        run: node scripts/fetch-data.mjs
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}

      - name: Save data to the repo
        run: |
          # Commit as the repo owner so Vercel deploys it on the free plan.
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update data"
            git pull --rebase
            git push
          fi
